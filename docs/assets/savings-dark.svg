<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Savings for one user: the same work costs $200 on all-Fable and less with Tierwise, with less waiting time"><title>Savings for one user: the same work costs $200 on all-Fable and less with Tierwise, with less waiting time</title><rect width="100%" height="100%" rx="12" fill="#0d1117"/><text x="56.0" y="52.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start">One user, the same work: $200 of all-Fable usage</text><text x="56.0" y="76.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Measured cost and time per job, applied to the work a $200 all-Fable budget pays for (5.66 jobs).</text><text x="56.0" y="122.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">API cost</text><text x="56.0" y="155.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Without Tierwise</text><text x="56.0" y="172.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">all-Fable</text><rect x="266.0" y="138.0" width="628.0" height="34.0" rx="5" fill="#00a888" /><text x="904.0" y="161.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">$200.00</text><text x="56.0" y="203.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">With Tierwise</text><text x="56.0" y="220.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">average of 3 runs</text><rect x="266.0" y="186.0" width="189.4" height="34.0" rx="5" fill="#338ced" /><text x="465.4" y="209.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">$60.33</text><text x="535.0" y="209.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#338ced" text-anchor="start">saves $139.67 (69.8%)</text><text x="56.0" y="262.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Waiting time</text><text x="56.0" y="295.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Without Tierwise</text><text x="56.0" y="312.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">all-Fable</text><rect x="266.0" y="278.0" width="628.0" height="34.0" rx="5" fill="#00a888" /><text x="904.0" y="301.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">5 h 42 min</text><text x="56.0" y="343.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">With Tierwise</text><text x="56.0" y="360.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">average of 3 runs</text><rect x="266.0" y="326.0" width="310.3" height="34.0" rx="5" fill="#338ced" /><text x="586.3" y="349.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">2 h 49 min</text><text x="690.3" y="349.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#338ced" text-anchor="start">saves 2 h 53 min (50.6%)</text><text x="56.0" y="412.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">The same $200 pays for 18.8 jobs with Tierwise instead of 5.7: 3.32× the work. Waiting time is wall-clock agent time, not time spent reviewing.</text></svg>
