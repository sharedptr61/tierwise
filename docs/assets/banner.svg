<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Tierwise headline results: cost, speed, hidden tests and research quality against single-model Claude Code"><title>Tierwise headline results: cost, speed, hidden tests and research quality against single-model Claude Code</title><rect width="100%" height="100%" rx="12" fill="#0f1b2d"/><defs><filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><text x="56.0" y="86.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#eef3fb" text-anchor="start">Tierwise</text><text x="56.0" y="124.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#a9b8cf" text-anchor="start">The right model for every step of your Claude Code work.</text><rect x="56.0" y="162.0" width="256.0" height="130.0" rx="12" fill="#16263d" /><text x="78.0" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#39ff14" filter="url(#glow)">70%</text><text x="78.0" y="254.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eef3fb" text-anchor="start">lower cost</text><text x="78.0" y="276.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a9b8cf" text-anchor="start">vs all-Fable: $10.66 vs $35.34 a job</text><rect x="328.0" y="162.0" width="256.0" height="130.0" rx="12" fill="#16263d" /><text x="350.0" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#39ff14" filter="url(#glow)">2.0×</text><text x="350.0" y="254.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eef3fb" text-anchor="start">faster</text><text x="350.0" y="276.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a9b8cf" text-anchor="start">vs all-Fable: 29.8 vs 60.5 min a job</text><rect x="600.0" y="162.0" width="256.0" height="130.0" rx="12" fill="#16263d" /><text x="622.0" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#39ff14" filter="url(#glow)">19/19</text><text x="622.0" y="254.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eef3fb" text-anchor="start">hidden tests</text><text x="622.0" y="276.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a9b8cf" text-anchor="start">passed in every run</text><rect x="872.0" y="162.0" width="256.0" height="130.0" rx="12" fill="#16263d" /><text x="894.0" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#39ff14" filter="url(#glow)">84/100</text><text x="894.0" y="254.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eef3fb" text-anchor="start">research score</text><text x="894.0" y="276.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a9b8cf" text-anchor="start">level with all-Opus (83)</text></svg>
